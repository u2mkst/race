<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KST RACE</title>
    <style>
        /* -------------------------------------
           [0] 외부 웹 폰트 정의 (Paperlogy)
        ------------------------------------- */
        @font-face {
            font-family: 'Paperozi';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-8ExtraBold.woff2') format('woff2');
            font-weight: 800;
            font-display: swap;
        }
        @font-face {
            font-family: 'Paperozi';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-4Regular.woff2') format('woff2');
            font-weight: 400;
            font-display: swap;
        }

        body {
            background-color: #0b0f19;
            color: #a5b1c2;
            font-family: 'Paperozi', 'Segoe UI', sans-serif;
            font-weight: 400;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            overflow-x: hidden;
        }

        /* -------------------------------------
           [1] 대기 화면
        ------------------------------------- */
        #readyScreen {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 550px;
            padding: 40px 30px;
            background: linear-gradient(145deg, #121824, #080b11);
            border-radius: 24px;
            box-shadow: 0 0 40px rgba(235, 94, 40, 0.25);
            border: 2px solid #eb5e28;
            text-align: center;
            box-sizing: border-box;
        }

        #readyScreen h1 {
            font-family: 'Paperozi', sans-serif;
            font-weight: 800;
            color: #fff;
            font-size: 2.7rem;
            margin: 0 0 8px 0;
            text-transform: uppercase;
            letter-spacing: 4px;
            text-shadow: 0 0 15px #eb5e28;
        }

        #readyScreen .desc {
            color: #ccc;
            font-size: 0.95rem;
            margin-bottom: 25px;
        }

        textarea {
            font-family: 'Paperozi', sans-serif;
            font-weight: 400;
            width: 100%;
            height: 120px;
            padding: 15px;
            border-radius: 12px;
            border: 2px solid #25334a;
            background-color: #0b0f19;
            color: #eb5e28;
            font-size: 16px;
            resize: none;
            box-sizing: border-box;
            outline: none;
            margin-bottom: 30px;
            transition: 0.3s;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
        }

        textarea:focus {
            border-color: #ffd166;
            box-shadow: 0 0 15px rgba(255, 209, 102, 0.4), inset 0 0 5px rgba(0,0,0,0.8);
            color: #ffd166;
        }

        .action-btn {
            font-family: 'Paperozi', sans-serif;
            font-weight: 800;
            padding: 16px 70px;
            font-size: 20px;
            color: #fff;
            background: linear-gradient(135deg, #eb5e28, #ffd166);
            border: none;
            border-radius: 40px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(235, 94, 40, 0.4);
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 25px; /* 하단 텍스트 링크와 간격 설정 */
        }

        .action-btn:hover {
            transform: translateY(-4px) scale(1.03);
            box-shadow: 0 0 35px rgba(235, 94, 40, 0.8);
        }

        /* [신기능] 시작 버튼 아래 주황색 글씨 링크 스타일 */
        .text-links-container {
            display: flex;
            gap: 20px;
            justify-content: center;
        }

        .text-link {
            font-family: 'Paperozi', sans-serif;
            font-weight: 800;
            color: #eb5e28; /* 주변 주황색 테마와 통일 */
            text-decoration: none;
            font-size: 14px;
            letter-spacing: 0.5px;
            transition: 0.2s;
            background: none;
            border: none;
            padding: 5px 10px;
            cursor: pointer;
        }

        .text-link:hover {
            color: #ffd166; /* 호버 시 피드백 */
            text-shadow: 0 0 10px rgba(255, 209, 102, 0.6);
            transform: translateY(-1px);
        }

        /* -------------------------------------
           [2] 게임 화면 및 트랙
        ------------------------------------- */
        #gameScreen {
            display: none;
            width: 100%;
            max-width: 1000px;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .live-header {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 10px;
            padding: 0 10px;
            box-sizing: border-box;
        }

        .live-badge {
            font-family: 'Paperozi', sans-serif;
            font-weight: 800;
            background-color: #d90429;
            color: #fff;
            padding: 6px 18px;
            border-radius: 20px;
            font-size: 13px;
            letter-spacing: 1px;
            box-shadow: 0 0 15px #d90429;
            animation: blink 0.8s infinite alternate;
        }

        .mini-map-container {
            width: 100%;
            background: #111622;
            border: 2px solid #25334a;
            border-radius: 12px;
            height: 34px;
            margin-bottom: 15px;
            position: relative;
            overflow: hidden;
            box-sizing: border-box;
        }

        .mini-map-progress {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
        }

        .mini-runner-dot {
            position: absolute;
            top: 50%;
            transform: translate(-50%, -50%);
            padding: 2px 7px;
            border-radius: 10px;
            font-family: 'Paperozi', sans-serif;
            font-weight: 800;
            font-size: 11px;
            color: #fff;
            white-space: nowrap;
            box-shadow: 0 2px 6px rgba(0,0,0,0.5);
            transition: left 0.1s linear;
            border: 1px solid rgba(255,255,255,0.3);
        }

        .mini-endpoint {
            position: absolute;
            right: 0; top: 0; bottom: 0;
            width: 15px;
            background: repeating-linear-gradient(45deg, #fff, #fff 4px, #000 4px, #000 8px);
        }

        @keyframes blink { from { opacity: 0.4; } to { opacity: 1; } }

        .stadium-box {
            width: 100%;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 30px 70px rgba(0,0,0,0.8);
            border: 4px solid #25334a;
            background-color: #1a2436;
        }

        canvas {
            display: block;
            width: 100%;
            height: auto;
        }

        #winnerPopup {
            font-family: 'Paperozi', sans-serif;
            font-weight: 800;
            position: fixed;
            bottom: -150px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #ffd700, #ff9f43);
            color: #000;
            padding: 20px 50px;
            border-radius: 50px;
            font-size: 24px;
            box-shadow: 0 15px 40px rgba(255, 215, 0, 0.5);
            border: 3px solid #fff;
            z-index: 100;
            transition: bottom 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-align: center;
            white-space: nowrap;
        }

        #winnerPopup.show {
            bottom: 40px;
        }

        /* -------------------------------------
           [3] 결과 화면
        ------------------------------------- */
        #resultScreen {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 650px;
            padding: 40px;
            background: linear-gradient(145deg, #101524, #070914);
            border-radius: 32px;
            box-shadow: 0 0 60px rgba(255, 215, 0, 0.2);
            border: 2px solid rgba(255, 215, 0, 0.3);
            text-align: center;
            box-sizing: border-box;
            position: relative;
        }

        #resultScreen h2 {
            font-family: 'Paperozi', sans-serif;
            font-weight: 800;
            color: #ffd700;
            font-size: 2.6rem;
            margin: 0 0 10px 0;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
            letter-spacing: 3px;
        }

        .podium-container {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            width: 100%;
            height: 280px;
            margin: 30px 0 20px 0;
            padding-bottom: 10px;
            border-bottom: 4px solid #2d3748;
        }

        .podium-column {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            margin: 0 12px;
            width: 130px;
            position: relative;
            transform: scaleY(0); 
            transform-origin: bottom;
            box-sizing: border-box;
        }

        .podium-column.animate {
            animation: riseUp 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.2) forwards;
        }

        @keyframes riseUp {
            0% { transform: scaleY(0); }
            70% { transform: scaleY(1.08); }
            100% { transform: scaleY(1); }
        }

        .podium-user {
            font-family: 'Paperozi', sans-serif;
            font-weight: 800;
            font-size: 16px;
            color: #fff;
            margin-bottom: 12px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            text-align: center;
            width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            opacity: 0;
            transition: opacity 0.3s ease 0.6s;
        }
        .podium-column.animate .podium-user {
            opacity: 1;
        }

        .podium-medal {
            font-size: 2rem;
            margin-bottom: -5px;
            z-index: 2;
        }

        .podium-box-graphic {
            font-family: 'Paperozi', sans-serif;
            font-weight: 800;
            width: 100%;
            border-radius: 8px 8px 0 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            color: rgba(255,255,255,0.8);
            box-shadow: inset 0 4px 10px rgba(255,255,255,0.2), 0 10px 25px rgba(0,0,0,0.5);
            text-shadow: 0 2px 5px rgba(0,0,0,0.4);
        }

        .p-1 { height: 150px; background: linear-gradient(135deg, #ffd700, #b38600); border: 2px solid #ffd700; }
        .p-2 { height: 110px; background: linear-gradient(135deg, #e2e8f0, #718096); border: 2px solid #cbd5e1; }
        .p-3 { height: 80px; background: linear-gradient(135deg, #cd7f32, #704214); border: 2px solid #cd7f32; }

        .leaderboard {
            font-family: 'Paperozi', sans-serif;
            font-weight: 400;
            width: 100%;
            text-align: left;
            margin: 15px auto 30px auto;
            font-size: 16px;
            line-height: 2.2;
            border-top: 1px solid rgba(255,255,255,0.08);
            padding-top: 15px;
            max-height: 160px;
            overflow-y: auto;
        }

        .rank-item {
            display: flex;
            justify-content: space-between;
            color: #a5b1c2;
            padding: 2px 12px;
            border-radius: 6px;
        }
        .rank-item:nth-child(even) { background: rgba(255,255,255,0.02); }
        .rank-item.last { font-weight: 800; color: #ef233c; background: rgba(239, 35, 60, 0.08); }

        .retry-btn {
            font-family: 'Paperozi', sans-serif;
            font-weight: 800;
            background: transparent;
            color: #ffd700;
            border: 2px solid #ffd700;
            padding: 12px 60px;
            font-size: 18px;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.2s;
        }

        .retry-btn:hover {
            background: #ffd700;
            color: #05070f;
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.6);
        }

        #confettiCanvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            border-radius: 32px;
            z-index: 5;
        }
    </style>
</head>
<body>

    <!-- [1단계] 대기 화면 -->
    <div id="readyScreen">
        <h1>KST RACE</h1>
        <div class="desc">주자 이름을 쉼표(,)로 구분하여 입력하고 레이스를 개시하세요!</div>
        <textarea id="nameInput">한이,바가,라면,진상,조교,제갈,후지산,제육,장래</textarea>
        <button class="action-btn" onclick="goToGame()">시작 🏁</button>
        
        <!-- [신기능] 시작 버튼 하단 글씨 링크 (주황색 테마 일치) -->
        <div class="text-links-container">
            <a href="https://lazygyu.github.io/roulette/" target="_blank" class="text-link">마블룰렛</a>
            <a href="https://wheelofnames.com/kqt-zp7" target="_blank" class="text-link">돌림판</a>
        </div>
    </div>

    <!-- [2단계] 게임 화면 -->
    <div id="gameScreen">
        <div class="live-header">
            <div class="live-badge">● LIVE TRACKING</div>
        </div>
        
        <div class="mini-map-container">
            <div class="mini-map-progress" id="miniMapContainer"></div>
            <div class="mini-endpoint"></div>
        </div>

        <div class="stadium-box">
            <canvas id="raceCanvas" width="1000" height="520"></canvas>
        </div>
        <div id="winnerPopup">🥇 WINNER: Kaiser !!</div>
    </div>

    <!-- [3단계] 결과 화면 -->
    <div id="resultScreen">
        <canvas id="confettiCanvas"></canvas>
        <h2>KST RACE Result</h2>
        
        <div class="podium-container">
            <div class="podium-column" id="podium2">
                <div class="podium-user" id="p2Name">🥈 대기</div>
                <div class="podium-medal">🥈</div>
                <div class="podium-box-graphic p-2">2</div>
            </div>
            <div class="podium-column" id="podium1">
                <div class="podium-user" id="p1Name" style="color:#ffd700; font-size:19px;">🥇 대기</div>
                <div class="podium-medal">👑</div>
                <div class="podium-box-graphic p-1">1</div>
            </div>
            <div class="podium-column" id="podium3">
                <div class="podium-user" id="p3Name">🥉 대기</div>
                <div class="podium-medal">🥉</div>
                <div class="podium-box-graphic p-3">3</div>
            </div>
        </div>

        <div class="leaderboard" id="rankList"></div>
        <button class="retry-btn" onclick="goToReady()">다시하기</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script>
        const canvas = document.getElementById('raceCanvas');
        const confettiCanvas = document.getElementById('confettiCanvas');
        const cCtx = confettiCanvas.getContext('2d');
        const miniMapContainer = document.getElementById('miniMapContainer');

        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playBoosterSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(850, audioCtx.currentTime + 0.4);
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.4);
        }

        function playStunSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(400, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(80, audioCtx.currentTime + 0.35);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.35);
        }

        function playBananaSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(200, audioCtx.currentTime);
            osc.frequency.quadraticRampToValueAtTime(600, audioCtx.currentTime + 0.15);
            osc.frequency.quadraticRampToValueAtTime(150, audioCtx.currentTime + 0.3);
            gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        }

        function playFinishSound() {
            if (!audioCtx) return;
            const notes = [261.63, 329.63, 392.00, 523.25]; 
            const now = audioCtx.currentTime;
            notes.forEach((freq, index) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(freq, now + (index * 0.12));
                gain.gain.setValueAtTime(0.1, now + (index * 0.12));
                gain.gain.linearRampToValueAtTime(0.005, now + (index * 0.12) + 0.25);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now + (index * 0.12));
                osc.stop(now + (index * 0.12) + 0.25);
            });
        }

        const teamColors = [
            { main: '#ff2a6d', sub: '#ff76b4' },
            { main: '#05d9e8', sub: '#1dd1a1' },
            { main: '#ffbc42', sub: '#feca57' },
            { main: '#a124f5', sub: '#8e44ad' },
            { main: '#00bbf9', sub: '#1dd1a1' },
            { main: '#00f5d4', sub: '#2e5bff' }
        ];

        let runners = [];
        let items = [];
        let bananas = [];
        let rankRecords = [];
        let confettiParticles = [];
        let animationFrameId;
        let confettiFrameId;

        let camX = 0;
        const startX = 120;
        const finishX = 8000;
        let laneHeight = 70;
        let firstPlaceDeclared = false;

        // -------------------------------------
        // [3D] Three.js 렌더링 엔진
        // -------------------------------------
        let renderer = null;
        let scene = null;
        let camera = null;
        let totalWidth = 0;
        let runnerObjects = [];
        let itemObjects = [];

        let particlePool = [];
        let particleCursor = 0;
        const PARTICLE_POOL_SIZE = 140;
        let particleTexture = null;

        function toWorldZ(y) {
            return y - totalWidth / 2;
        }

        function roundRect(c, x, y, w, h, r) {
            c.beginPath();
            c.moveTo(x + r, y);
            c.arcTo(x + w, y, x + w, y + h, r);
            c.arcTo(x + w, y + h, x, y + h, r);
            c.arcTo(x, y + h, x, y, r);
            c.arcTo(x, y, x + w, y, r);
            c.closePath();
        }

        function makeNameSprite(text, colorHex) {
            const c = document.createElement('canvas');
            c.width = 256; c.height = 96;
            const cx = c.getContext('2d');
            cx.fillStyle = 'rgba(8,11,18,0.8)';
            roundRect(cx, 4, 4, 248, 88, 18); cx.fill();
            cx.strokeStyle = colorHex; cx.lineWidth = 5;
            roundRect(cx, 4, 4, 248, 88, 18); cx.stroke();
            cx.fillStyle = '#ffffff';
            cx.font = '800 42px "Paperozi", sans-serif';
            cx.textAlign = 'center'; cx.textBaseline = 'middle';
            cx.fillText(text, 128, 50);
            const tex = new THREE.CanvasTexture(c);
            const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false });
            const sprite = new THREE.Sprite(mat);
            sprite.scale.set(58, 22, 1);
            sprite.renderOrder = 999;
            return sprite;
        }

        function makeBannerSprite(text) {
            const c = document.createElement('canvas');
            c.width = 512; c.height = 128;
            const cx = c.getContext('2d');
            cx.fillStyle = '#ffffff';
            cx.font = '800 84px "Paperozi", sans-serif';
            cx.textAlign = 'center'; cx.textBaseline = 'middle';
            cx.shadowColor = 'rgba(225,6,0,0.95)'; cx.shadowBlur = 22;
            cx.lineWidth = 6; cx.strokeStyle = '#e10600';
            cx.strokeText(text, 256, 64);
            cx.fillText(text, 256, 64);
            const tex = new THREE.CanvasTexture(c);
            const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false });
            const sprite = new THREE.Sprite(mat);
            sprite.scale.set(180, 45, 1);
            return sprite;
        }

        function makeAsphaltTexture(baseColor) {
            const c = document.createElement('canvas');
            c.width = 128; c.height = 128;
            const cx = c.getContext('2d');
            cx.fillStyle = baseColor;
            cx.fillRect(0, 0, 128, 128);
            for (let i = 0; i < 900; i++) {
                const shade = Math.random() < 0.5 ? 'rgba(0,0,0,' : 'rgba(255,255,255,';
                cx.fillStyle = shade + (Math.random() * 0.08).toFixed(3) + ')';
                const s = Math.random() * 2.4 + 0.4;
                cx.fillRect(Math.random() * 128, Math.random() * 128, s, s);
            }
            const tex = new THREE.CanvasTexture(c);
            return tex;
        }

        function makeKerbTexture() {
            const c = document.createElement('canvas');
            c.width = 64; c.height = 16;
            const cx = c.getContext('2d');
            cx.fillStyle = '#f4f4f4'; cx.fillRect(0, 0, 64, 16);
            cx.fillStyle = '#d90429';
            cx.fillRect(0, 0, 32, 16);
            const tex = new THREE.CanvasTexture(c);
            tex.magFilter = THREE.NearestFilter;
            return tex;
        }

        function makeCheckerTexture() {
            const c = document.createElement('canvas');
            c.width = 32; c.height = 32;
            const cx = c.getContext('2d');
            cx.fillStyle = '#ffffff'; cx.fillRect(0, 0, 32, 32);
            cx.fillStyle = '#000000';
            cx.fillRect(0, 0, 16, 16);
            cx.fillRect(16, 16, 16, 16);
            const tex = new THREE.CanvasTexture(c);
            tex.magFilter = THREE.NearestFilter;
            return tex;
        }

        function getParticleTexture() {
            if (particleTexture) return particleTexture;
            const c = document.createElement('canvas');
            c.width = 64; c.height = 64;
            const cx = c.getContext('2d');
            const grad = cx.createRadialGradient(32, 32, 0, 32, 32, 32);
            grad.addColorStop(0, 'rgba(255,255,255,1)');
            grad.addColorStop(1, 'rgba(255,255,255,0)');
            cx.fillStyle = grad;
            cx.fillRect(0, 0, 64, 64);
            particleTexture = new THREE.CanvasTexture(c);
            return particleTexture;
        }

        function buildParticlePool() {
            const tex = getParticleTexture();
            particlePool.forEach(s => scene.remove(s));
            particlePool = [];
            for (let i = 0; i < PARTICLE_POOL_SIZE; i++) {
                const mat = new THREE.SpriteMaterial({
                    map: tex, color: 0xffffff, transparent: true, opacity: 0,
                    depthWrite: false, blending: THREE.AdditiveBlending
                });
                const sprite = new THREE.Sprite(mat);
                sprite.visible = false;
                sprite.userData.life = 0;
                scene.add(sprite);
                particlePool.push(sprite);
            }
            particleCursor = 0;
        }

        function spawnParticle(x, y, z, colorHex, size) {
            const sprite = particlePool[particleCursor];
            particleCursor = (particleCursor + 1) % PARTICLE_POOL_SIZE;
            sprite.position.set(x, y, z);
            sprite.material.color.setHex(colorHex);
            sprite.material.opacity = 0.85;
            sprite.scale.set(size, size, 1);
            sprite.visible = true;
            sprite.userData.life = 1;
        }

        function updateParticles() {
            particlePool.forEach(sprite => {
                if (sprite.userData.life > 0) {
                    sprite.userData.life -= 0.045;
                    sprite.material.opacity = Math.max(0, sprite.userData.life * 0.85);
                    sprite.position.y += 0.25;
                    sprite.scale.multiplyScalar(0.985);
                    if (sprite.userData.life <= 0) sprite.visible = false;
                }
            });
        }

        function buildScene(names) {
            if (scene) {
                scene.traverse(obj => {
                    if (obj.geometry) obj.geometry.dispose();
                    if (obj.material) {
                        if (Array.isArray(obj.material)) obj.material.forEach(m => m.dispose());
                        else obj.material.dispose();
                    }
                });
            }

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0b0f19);
            scene.fog = new THREE.Fog(0x0b0f19, 1000, 5200);

            totalWidth = names.length * laneHeight;
            const trackStartX = -150;
            const trackEndX = finishX + 500;
            const trackLength = trackEndX - trackStartX;

            const ambient = new THREE.AmbientLight(0x93a2c2, 0.7);
            scene.add(ambient);
            const sun = new THREE.DirectionalLight(0xfff2df, 1.3);
            sun.position.set(300, 500, 200);
            scene.add(sun);
            const rim = new THREE.DirectionalLight(0x6f8dff, 0.35);
            rim.position.set(-300, 200, -200);
            scene.add(rim);

            const asphaltA = makeAsphaltTexture('#202225');
            const asphaltB = makeAsphaltTexture('#24262a');
            [asphaltA, asphaltB].forEach(tex => {
                tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
                tex.repeat.set(trackLength / 130, 1);
            });

            for (let i = 0; i < names.length; i++) {
                const laneCenterY = (i * laneHeight) + (laneHeight / 2);
                const laneGeo = new THREE.PlaneGeometry(trackLength, laneHeight - 2);
                const laneMat = new THREE.MeshStandardMaterial({
                    map: (i % 2 === 0) ? asphaltA : asphaltB,
                    roughness: 0.95, metalness: 0.05
                });
                const laneMesh = new THREE.Mesh(laneGeo, laneMat);
                laneMesh.rotation.x = -Math.PI / 2;
                laneMesh.position.set(trackStartX + trackLength / 2, 0, toWorldZ(laneCenterY));
                scene.add(laneMesh);

                if (i > 0) {
                    const z = toWorldZ(i * laneHeight);
                    const points = [new THREE.Vector3(trackStartX, 0.6, z), new THREE.Vector3(trackEndX, 0.6, z)];
                    const geo = new THREE.BufferGeometry().setFromPoints(points);
                    const mat = new THREE.LineDashedMaterial({ color: 0xffffff, dashSize: 22, gapSize: 18, transparent: true, opacity: 0.5 });
                    const line = new THREE.Line(geo, mat);
                    line.computeLineDistances();
                    scene.add(line);
                }
            }

            const kerbTex = makeKerbTexture();
            kerbTex.wrapS = THREE.RepeatWrapping;
            kerbTex.repeat.set(trackLength / 36, 1);
            [-15, totalWidth + 15].forEach(zEdge => {
                const kerbGeo = new THREE.PlaneGeometry(trackLength, 9);
                const kerbMat = new THREE.MeshBasicMaterial({ map: kerbTex });
                const kerb = new THREE.Mesh(kerbGeo, kerbMat);
                kerb.rotation.x = -Math.PI / 2;
                kerb.position.set(trackStartX + trackLength / 2, 0.35, toWorldZ(zEdge));
                scene.add(kerb);

                const wallGeo = new THREE.BoxGeometry(trackLength, 20, 6);
                const wallMat = new THREE.MeshStandardMaterial({ color: 0xe9e9ee, roughness: 0.75 });
                const wall = new THREE.Mesh(wallGeo, wallMat);
                wall.position.set(trackStartX + trackLength / 2, 10, toWorldZ(zEdge));
                scene.add(wall);
            });

            const startCheckerTex = makeCheckerTexture();
            startCheckerTex.wrapS = startCheckerTex.wrapT = THREE.RepeatWrapping;
            startCheckerTex.repeat.set(1, Math.max(1, Math.round(totalWidth / 24)));
            const startGridGeo = new THREE.PlaneGeometry(16, totalWidth);
            const startGridMat = new THREE.MeshBasicMaterial({ map: startCheckerTex });
            const startGrid = new THREE.Mesh(startGridGeo, startGridMat);
            startGrid.rotation.x = -Math.PI / 2;
            startGrid.position.set(startX, 0.4, toWorldZ(totalWidth / 2));
            scene.add(startGrid);

            [totalWidth / 2 + 30, -30].forEach(zEdge => {
                const pGeo = new THREE.BoxGeometry(10, 160, 10);
                const pMat = new THREE.MeshStandardMaterial({ color: 0xe10600, emissive: 0x330000, roughness: 0.35, metalness: 0.5 });
                const pillar = new THREE.Mesh(pGeo, pMat);
                pillar.position.set(startX, 80, toWorldZ(zEdge));
                scene.add(pillar);
            });

            const startBeam = new THREE.Mesh(
                new THREE.BoxGeometry(10, 14, totalWidth + 70),
                new THREE.MeshStandardMaterial({ color: 0xe10600, emissive: 0x330000, roughness: 0.35, metalness: 0.5 })
            );
            startBeam.position.set(startX, 155, toWorldZ(totalWidth / 2));
            scene.add(startBeam);

            const startSprite = makeBannerSprite('START');
            startSprite.position.set(startX, 190, toWorldZ(totalWidth / 2));
            scene.add(startSprite);

            const checkerTex = makeCheckerTexture();
            checkerTex.wrapS = checkerTex.wrapT = THREE.RepeatWrapping;
            checkerTex.repeat.set(1, Math.max(1, Math.round(totalWidth / 24)));
            const finishGeo = new THREE.PlaneGeometry(28, totalWidth);
            const finishMat = new THREE.MeshBasicMaterial({ map: checkerTex });
            const finishMesh = new THREE.Mesh(finishGeo, finishMat);
            finishMesh.rotation.x = -Math.PI / 2;
            finishMesh.position.set(finishX, 0.4, toWorldZ(totalWidth / 2));
            scene.add(finishMesh);

            [totalWidth / 2 + 30, -30].forEach(zEdge => {
                const pillarGeo = new THREE.BoxGeometry(10, 160, 10);
                const pillarMat = new THREE.MeshStandardMaterial({ color: 0xe10600, emissive: 0x330000, roughness: 0.35, metalness: 0.5 });
                const pillar = new THREE.Mesh(pillarGeo, pillarMat);
                pillar.position.set(finishX, 80, toWorldZ(zEdge));
                scene.add(pillar);
            });

            const beamGeo = new THREE.BoxGeometry(10, 14, totalWidth + 70);
            const beamMat = new THREE.MeshStandardMaterial({ color: 0xe10600, emissive: 0x330000, roughness: 0.35, metalness: 0.5 });
            const beam = new THREE.Mesh(beamGeo, beamMat);
            beam.position.set(finishX, 155, toWorldZ(totalWidth / 2));
            scene.add(beam);

            const finishSprite = makeBannerSprite('FINISH');
            finishSprite.position.set(finishX, 190, toWorldZ(totalWidth / 2));
            scene.add(finishSprite);

            camera = new THREE.PerspectiveCamera(55, 1000 / canvas.height, 1, 9500);
            camera.position.set(startX - 210, 105, toWorldZ(totalWidth / 2));
            camera.lookAt(startX + 380, 14, toWorldZ(totalWidth / 2));

            if (!renderer) {
                renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
                renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
                renderer.outputEncoding = THREE.sRGBEncoding;
                renderer.toneMapping = THREE.ACESFilmicToneMapping;
                renderer.toneMappingExposure = 1.05;
            }
            renderer.setSize(1000, canvas.height, false);

            runnerObjects = [];
            itemObjects = [];

            buildParticlePool();
        }

                const bodyGroup = new THREE.Group();
                bodyGroup.position.y = 9;
                group.add(bodyGroup);

                const chassisMat = new THREE.MeshStandardMaterial({
                    color: runner.color,
                    emissive: new THREE.Color(runner.color).multiplyScalar(0.35),

                });
                const chassis = new THREE.Mesh(new THREE.BoxGeometry(34, 6, 13), chassisMat);
                bodyGroup.add(chassis);

                const cabinMat = new THREE.MeshStandardMaterial({ color: 0x11141c, roughness: 0.25, metalness: 0.6 });
                const cabin = new THREE.Mesh(new THREE.BoxGeometry(9, 5, 8), cabinMat);
                cabin.position.set(-2, 5, 0);
                bodyGroup.add(cabin);

                const accentMat = new THREE.MeshStandardMaterial({ color: runner.colorSub, roughness: 0.3, metalness: 0.4 });

                const nose = new THREE.Mesh(new THREE.ConeGeometry(6, 14, 4), accentMat);
                nose.rotation.z = -Math.PI / 2;
                nose.scale.set(1, 1, 0.5);
                nose.position.set(24, 0, 0);
                bodyGroup.add(nose);

                const frontWing = new THREE.Mesh(new THREE.BoxGeometry(5, 1.5, 24), accentMat);
                frontWing.position.set(29, -6, 0);
                bodyGroup.add(frontWing);

                const wingMat = new THREE.MeshStandardMaterial({ color: 0x14161c, roughness: 0.3, metalness: 0.5 });
                const rearWing = new THREE.Mesh(new THREE.BoxGeometry(5, 1.5, 17), wingMat);
                rearWing.position.set(-19, 9, 0);
                bodyGroup.add(rearWing);
                [-6, 6].forEach(sz => {
                    const strut = new THREE.Mesh(new THREE.BoxGeometry(2, 9, 1.5), wingMat);
                    strut.position.set(-19, 4.5, sz);
                    bodyGroup.add(strut);
                });

                const wheels = [];
                const wheelMat = new THREE.MeshStandardMaterial({ color: 0x161616, roughness: 0.85 });
                [[13, -10], [13, 10], [-13, -10], [-13, 10]].forEach(([wx, wz]) => {
                    const pivot = new THREE.Group();
                    pivot.position.set(wx, 5.5, wz);
                    pivot.rotation.x = Math.PI / 2;
                    const wheelMesh = new THREE.Mesh(new THREE.CylinderGeometry(5.5, 5.5, 5.5, 12), wheelMat);
                    pivot.add(wheelMesh);
                    group.add(pivot);
                    wheels.push(wheelMesh);
                });

                const shadowGeo = new THREE.CircleGeometry(26, 20);
                const shadowMat = new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.35 });
                const shadowMesh = new THREE.Mesh(shadowGeo, shadowMat);
                shadowMesh.rotation.x = -Math.PI / 2;
                shadowMesh.position.y = 0.5;
                group.add(shadowMesh);

                const nameSprite = makeNameSprite(runner.name, runner.color);
                nameSprite.position.y = 46;
                group.add(nameSprite);

                const ringGeo = new THREE.TorusGeometry(28, 2, 8, 24);
                const ringMat = new THREE.MeshBasicMaterial({ color: 0xffd166, transparent: true, opacity: 0.9 });
                const ring = new THREE.Mesh(ringGeo, ringMat);
                ring.rotation.x = Math.PI / 2;
                ring.position.y = 8;
                ring.visible = false;
                group.add(ring);

                scene.add(group);
                runnerObjects.push({ group, bodyGroup, chassisMat, wheels, nameSprite, ring });
            });
        }

        function buildItemMeshes() {
            itemObjects = items.map(box => {
                const geo = new THREE.BoxGeometry(20, 20, 20);
                const mat = new THREE.MeshStandardMaterial({
                    color: 0xffd166, emissive: 0xeb8f00, emissiveIntensity: 0.6,

                });

        function spawnBananaMesh(banana) {
            const geo = new THREE.SphereGeometry(9, 10, 8);
            geo.scale(1.5, 0.6, 1);
            const mat = new THREE.MeshStandardMaterial({ color: 0xffea00, emissive: 0x998200, emissiveIntensity: 0.5, roughness: 0.4 });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(banana.x, 8, toWorldZ(banana.y));
            scene.add(mesh);
            banana.mesh = mesh;
        }

        function updateCamera(anyBoost) {
            const targetX = camX - 210;
            camera.position.x += (targetX - camera.position.x) * 0.17;

            const targetY = 105 + (anyBoost ? 6 : 0);
            camera.position.y += (targetY - camera.position.y) * 0.08;

            const centerZ = toWorldZ(totalWidth / 2);
            camera.position.z += (centerZ - camera.position.z) * 0.06;

            if (anyBoost) {
                camera.position.y += (Math.random() - 0.5) * 1.6;
                camera.position.z += (Math.random() - 0.5) * 1.6;
            }

            camera.lookAt(camera.position.x + 380, 14, centerZ);

            const targetFov = anyBoost ? 62 : 55;
            camera.fov += (targetFov - camera.fov) * 0.06;
            camera.updateProjectionMatrix();
        }

        function draw3DScene() {
            items.forEach((box, idx) => {
                const mesh = itemObjects[idx];
                mesh.visible = box.active;
                if (box.active) {
                    box.pulse += 0.06;
                    mesh.position.y = 14 + Math.sin(box.pulse) * 4;
                    mesh.rotation.y += 0.05;
                    mesh.rotation.x += 0.015;
                }
            });

            bananas.forEach(b => {
                if (b.mesh) b.mesh.visible = b.active;
            });

            let anyBoost = false;

            runners.forEach(runner => {
                const obj = runnerObjects[runner.id];
                const bobbing = Math.sin(runner.pulse) * 2.2;
                const worldZ = toWorldZ(runner.y);

                obj.group.position.set(runner.x, 0, worldZ);
                obj.bodyGroup.position.y = 9 + bobbing;
                obj.bodyGroup.rotation.z = Math.sin(runner.pulse * 0.7) * 0.04;
                obj.nameSprite.position.y = 46 + bobbing;

                obj.wheels.forEach(w => { w.rotation.y += runner.speed * 0.3; });

                if (runner.status === 'BOOSTER') {
                    anyBoost = true;
                    obj.ring.visible = true;
                    obj.ring.material.color.setHex(0xffd166);
                    obj.ring.rotation.z += 0.25;
                    obj.chassisMat.emissiveIntensity = 1.1;
                } else if (runner.status === 'STUN') {
                    obj.ring.visible = true;
                    obj.ring.material.color.setHex(0x05d9e8);
                    obj.ring.rotation.z += 0.08;
                    obj.chassisMat.emissiveIntensity = 0.25;
                } else {
                    obj.ring.visible = false;
                    obj.chassisMat.emissiveIntensity = 0.5;
                }

                if (!runner.finished && Math.random() < 0.5) {
                    const color = runner.status === 'BOOSTER' ? 0xffbc42 : (runner.status === 'STUN' ? 0x05d9e8 : 0x4e5d78);
                    const size = runner.status === 'BOOSTER' ? 10 : 5;
                    spawnParticle(runner.x - 20, 6 + Math.random() * 4, worldZ + (Math.random() * 8 - 4), color, size);
                }
            });

            updateParticles();
            updateCamera(anyBoost);

            renderer.render(scene, camera);
        }

        function goToReady() {
            cancelAnimationFrame(confettiFrameId);
            confettiParticles = [];
            document.getElementById('resultScreen').style.display = 'none';
            document.getElementById('readyScreen').style.display = 'flex';
        }

        function updateRace() {
            let allFinished = true;
            let leadX = 0;
            let unfinishedCount = 0;
            let lastX = Infinity; 
            let lastRunner = null;

            runners.forEach(r => {
                if(!r.finished && r.x > leadX) leadX = r.x;
            });

            runners.forEach(runner => {
                if (!runner.finished) {
                    allFinished = false;
                    unfinishedCount++;

                    let catchUpBuff = 0;
                    if (leadX - runner.x > 400) {
                        catchUpBuff = (leadX - runner.x) * 0.004; 
                    }

                    if (runner.status === 'BOOSTER') {
                        runner.speed += (17 - runner.speed) * 0.15;
                        runner.statusTimer--;
                        if(runner.statusTimer <= 0) runner.status = 'NORMAL';
                    } else if (runner.status === 'STUN') {
                        runner.speed += (0.1 - runner.speed) * 0.2;
                        runner.statusTimer--;
                        if(runner.statusTimer <= 0) runner.status = 'NORMAL';
                    } else {
                        runner.speed += (runner.targetSpeed + catchUpBuff - runner.speed) * 0.05;
                        let progressBonus = (finishX - runner.x) / finishX * 4.5; 
                        if (Math.random() < 0.05) {
                            runner.targetSpeed = (Math.random() * 7 + 3.2) + progressBonus; 
                        }
                    }

                    runner.x += runner.speed;
                    runner.pulse += (runner.status === 'BOOSTER') ? 0.9 : 0.3;

                    bananas.forEach(b => {
                        if (b.active && Math.abs(runner.x - b.x) < 22 && Math.abs(runner.y - b.y) < 15) {
                            b.active = false;
                            runner.status = 'STUN';
                            runner.statusTimer = 40; 
                            playBananaSound(); 
                        }
                    });

                    items.forEach(box => {
                        if (box.active && Math.abs(runner.x - box.x) < 24 && Math.abs(runner.y - box.y) < 12) {
                            box.active = false;
                            if (Math.random() < 0.55) {
                                runner.status = 'BOOSTER'; 
                                runner.statusTimer = 45; 
                                playBoosterSound(); 

                                if (Math.random() < 0.30) {
                                    const banana = { x: runner.x - 30, y: runner.y, active: true };
                                    bananas.push(banana);
                                    spawnBananaMesh(banana);
                                }
                            } else {
                                runner.status = 'STUN'; 
                                runner.statusTimer = 35; 
                                playStunSound(); 
                            }
                        }
                    });

                    if (runner.x >= finishX) {
                        runner.finished = true;
                        runner.x = finishX;
                        rankRecords.push(runner.name);

                        if (!firstPlaceDeclared) {
                            firstPlaceDeclared = true;
                            showWinnerPopup(runner.name);
                        }
                    }
                }

                if (!runner.finished) {
                    if (runner.x < lastX) { lastX = runner.x; lastRunner = runner; }
                }

                const dot = document.getElementById(`miniDot_${runner.id}`);
                if (dot) {
                    const pct = Math.min(94, (runner.x / finishX) * 94); 
                    dot.style.left = `${pct}%`;
                }
            });

            let focusX = leadX;
            if (unfinishedCount === 1 && lastRunner) {
                focusX = lastRunner.x;
            }

            if (focusX > 400) {
                let targetCamX = focusX - 400;
                camX += (targetCamX - camX) * 0.13;
            }

            draw3DScene();

            if (!allFinished) {
                animationFrameId = requestAnimationFrame(updateRace);
            } else {
                cancelAnimationFrame(animationFrameId);
                setTimeout(goToResult, 1500); 
            }
        }

        function initConfetti() {
            confettiParticles = [];
            const colors = ['#ffd700', '#ff007f', '#00f5d4', '#00bbf9', '#ffffff'];
            for (let i = 0; i < 80; i++) {
                confettiParticles.push({
                    x: Math.random() * confettiCanvas.width,
                    y: Math.random() * confettiCanvas.height - confettiCanvas.height,
                    size: Math.random() * 6 + 4,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    speedY: Math.random() * 3 + 2,
                    speedX: Math.random() * 2 - 1,
                    rotation: Math.random() * 360,
                    rotationSpeed: Math.random() * 4 - 2
                });
            }
            updateConfetti();
        }

        function updateConfetti() {
            cCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
            confettiParticles.forEach(p => {
                p.y += p.speedY; p.x += p.speedX; p.rotation += p.rotationSpeed;
                cCtx.save(); cCtx.translate(p.x, p.y); cCtx.rotate(p.rotation * Math.PI / 180);
                cCtx.fillStyle = p.color; cCtx.fillRect(-p.size/2, -p.size/2, p.size, p.size); cCtx.restore();
                if (p.y > confettiCanvas.height) {
                    p.y = -10; p.x = Math.random() * confettiCanvas.width;
                }
            });
            confettiFrameId = requestAnimationFrame(updateConfetti);
        }
    </script>
</body>
