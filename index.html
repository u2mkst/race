<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KST RACE - Multi-Tool Edition</title>
    <style>
        /* -------------------------------------
           [0] 외부 웹 폰트 정의 (Paperlogy)
        ------------------------------------- */
        @font-face {
            font-family: 'Paperozi';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-8ExtraBold.woff2') format('woff2');
            font-weight: 800;
            font-display: swap;
        }
        @font-face {
            font-family: 'Paperozi';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-4Regular.woff2') format('woff2');
            font-weight: 400;
            font-display: swap;
        }

        body {
            background-color: #0b0f19;
            color: #a5b1c2;
            font-family: 'Paperozi', 'Segoe UI', sans-serif;
            font-weight: 400;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            overflow-x: hidden;
        }

        /* -------------------------------------
           [1] 대기 화면
        ------------------------------------- */
        #readyScreen {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 550px;
            padding: 40px 30px;
            background: linear-gradient(145deg, #121824, #080b11);
            border-radius: 24px;
            box-shadow: 0 0 40px rgba(235, 94, 40, 0.25);
            border: 2px solid #eb5e28;
            text-align: center;
            box-sizing: border-box;
        }

        #readyScreen h1 {
            font-family: 'Paperozi', sans-serif;
            font-weight: 800;
            color: #fff;
            font-size: 2.7rem;
            margin: 0 0 8px 0;
            text-transform: uppercase;
            letter-spacing: 4px;
            text-shadow: 0 0 15px #eb5e28;
        }

        #readyScreen .desc {
            color: #ccc;
            font-size: 0.95rem;
            margin-bottom: 25px;
        }

        textarea {
            font-family: 'Paperozi', sans-serif;
            font-weight: 400;
            width: 100%;
            height: 120px;
            padding: 15px;
            border-radius: 12px;
            border: 2px solid #25334a;
            background-color: #0b0f19;
            color: #eb5e28;
            font-size: 16px;
            resize: none;
            box-sizing: border-box;
            outline: none;
            margin-bottom: 30px;
            transition: 0.3s;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
        }

        textarea:focus {
            border-color: #ffd166;
            box-shadow: 0 0 15px rgba(255, 209, 102, 0.4), inset 0 0 5px rgba(0,0,0,0.8);
            color: #ffd166;
        }

        .action-btn {
            font-family: 'Paperozi', sans-serif;
            font-weight: 800;
            padding: 16px 70px;
            font-size: 20px;
            color: #fff;
            background: linear-gradient(135deg, #eb5e28, #ffd166);
            border: none;
            border-radius: 40px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(235, 94, 40, 0.4);
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 25px; /* 하단 텍스트 링크와 간격 설정 */
        }

        .action-btn:hover {
            transform: translateY(-4px) scale(1.03);
            box-shadow: 0 0 35px rgba(235, 94, 40, 0.8);
        }

        /* [신기능] 시작 버튼 아래 주황색 글씨 링크 스타일 */
        .text-links-container {
            display: flex;
            gap: 20px;
            justify-content: center;
        }

        .text-link {
            font-family: 'Paperozi', sans-serif;
            font-weight: 800;
            color: #eb5e28; /* 주변 주황색 테마와 통일 */
            text-decoration: none;
            font-size: 14px;
            letter-spacing: 0.5px;
            transition: 0.2s;
            background: none;
            border: none;
            padding: 5px 10px;
            cursor: pointer;
        }

        .text-link:hover {
            color: #ffd166; /* 호버 시 피드백 */
            text-shadow: 0 0 10px rgba(255, 209, 102, 0.6);
            transform: translateY(-1px);
        }

        /* -------------------------------------
           [2] 게임 화면 및 트랙
        ------------------------------------- */
        #gameScreen {
            display: none;
            width: 100%;
            max-width: 1000px;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .live-header {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 10px;
            padding: 0 10px;
            box-sizing: border-box;
        }

        .live-badge {
            font-family: 'Paperozi', sans-serif;
            font-weight: 800;
            background-color: #d90429;
            color: #fff;
            padding: 6px 18px;
            border-radius: 20px;
            font-size: 13px;
            letter-spacing: 1px;
            box-shadow: 0 0 15px #d90429;
            animation: blink 0.8s infinite alternate;
        }

        .mini-map-container {
            width: 100%;
            background: #111622;
            border: 2px solid #25334a;
            border-radius: 12px;
            height: 34px;
            margin-bottom: 15px;
            position: relative;
            overflow: hidden;
            box-sizing: border-box;
        }

        .mini-map-progress {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
        }

        .mini-runner-dot {
            position: absolute;
            top: 50%;
            transform: translate(-50%, -50%);
            padding: 2px 7px;
            border-radius: 10px;
            font-family: 'Paperozi', sans-serif;
            font-weight: 800;
            font-size: 11px;
            color: #fff;
            white-space: nowrap;
            box-shadow: 0 2px 6px rgba(0,0,0,0.5);
            transition: left 0.1s linear;
            border: 1px solid rgba(255,255,255,0.3);
        }

        .mini-endpoint {
            position: absolute;
            right: 0; top: 0; bottom: 0;
            width: 15px;
            background: repeating-linear-gradient(45deg, #fff, #fff 4px, #000 4px, #000 8px);
        }

        @keyframes blink { from { opacity: 0.4; } to { opacity: 1; } }

        .stadium-box {
            width: 100%;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 30px 70px rgba(0,0,0,0.8);
            border: 4px solid #25334a;
            background-color: #1a2436;
        }

        canvas {
            display: block;
            width: 100%;
            height: auto;
        }

        #winnerPopup {
            font-family: 'Paperozi', sans-serif;
            font-weight: 800;
            position: fixed;
            bottom: -150px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #ffd700, #ff9f43);
            color: #000;
            padding: 20px 50px;
            border-radius: 50px;
            font-size: 24px;
            box-shadow: 0 15px 40px rgba(255, 215, 0, 0.5);
            border: 3px solid #fff;
            z-index: 100;
            transition: bottom 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-align: center;
            white-space: nowrap;
        }

        #winnerPopup.show {
            bottom: 40px;
        }

        /* -------------------------------------
           [3] 결과 화면
        ------------------------------------- */
        #resultScreen {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 650px;
            padding: 40px;
            background: linear-gradient(145deg, #101524, #070914);
            border-radius: 32px;
            box-shadow: 0 0 60px rgba(255, 215, 0, 0.2);
            border: 2px solid rgba(255, 215, 0, 0.3);
            text-align: center;
            box-sizing: border-box;
            position: relative;
        }

        #resultScreen h2 {
            font-family: 'Paperozi', sans-serif;
            font-weight: 800;
            color: #ffd700;
            font-size: 2.6rem;
            margin: 0 0 10px 0;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
            letter-spacing: 3px;
        }

        .podium-container {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            width: 100%;
            height: 280px;
            margin: 30px 0 20px 0;
            padding-bottom: 10px;
            border-bottom: 4px solid #2d3748;
        }

        .podium-column {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            margin: 0 12px;
            width: 130px;
            position: relative;
            transform: scaleY(0); 
            transform-origin: bottom;
            box-sizing: border-box;
        }

        .podium-column.animate {
            animation: riseUp 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.2) forwards;
        }

        @keyframes riseUp {
            0% { transform: scaleY(0); }
            70% { transform: scaleY(1.08); }
            100% { transform: scaleY(1); }
        }

        .podium-user {
            font-family: 'Paperozi', sans-serif;
            font-weight: 800;
            font-size: 16px;
            color: #fff;
            margin-bottom: 12px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            text-align: center;
            width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            opacity: 0;
            transition: opacity 0.3s ease 0.6s;
        }
        .podium-column.animate .podium-user {
            opacity: 1;
        }

        .podium-medal {
            font-size: 2rem;
            margin-bottom: -5px;
            z-index: 2;
        }

        .podium-box-graphic {
            font-family: 'Paperozi', sans-serif;
            font-weight: 800;
            width: 100%;
            border-radius: 8px 8px 0 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            color: rgba(255,255,255,0.8);
            box-shadow: inset 0 4px 10px rgba(255,255,255,0.2), 0 10px 25px rgba(0,0,0,0.5);
            text-shadow: 0 2px 5px rgba(0,0,0,0.4);
        }

        .p-1 { height: 150px; background: linear-gradient(135deg, #ffd700, #b38600); border: 2px solid #ffd700; }
        .p-2 { height: 110px; background: linear-gradient(135deg, #e2e8f0, #718096); border: 2px solid #cbd5e1; }
        .p-3 { height: 80px; background: linear-gradient(135deg, #cd7f32, #704214); border: 2px solid #cd7f32; }

        .leaderboard {
            font-family: 'Paperozi', sans-serif;
            font-weight: 400;
            width: 100%;
            text-align: left;
            margin: 15px auto 30px auto;
            font-size: 16px;
            line-height: 2.2;
            border-top: 1px solid rgba(255,255,255,0.08);
            padding-top: 15px;
            max-height: 160px;
            overflow-y: auto;
        }

        .rank-item {
            display: flex;
            justify-content: space-between;
            color: #a5b1c2;
            padding: 2px 12px;
            border-radius: 6px;
        }
        .rank-item:nth-child(even) { background: rgba(255,255,255,0.02); }
        .rank-item.last { font-weight: 800; color: #ef233c; background: rgba(239, 35, 60, 0.08); }

        .retry-btn {
            font-family: 'Paperozi', sans-serif;
            font-weight: 800;
            background: transparent;
            color: #ffd700;
            border: 2px solid #ffd700;
            padding: 12px 60px;
            font-size: 18px;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.2s;
        }

        .retry-btn:hover {
            background: #ffd700;
            color: #05070f;
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.6);
        }

        #confettiCanvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            border-radius: 32px;
            z-index: 5;
        }
    </style>
</head>
<body>

    <!-- [1단계] 대기 화면 -->
    <div id="readyScreen">
        <h1>KST RACE</h1>
        <div class="desc">주자 이름을 쉼표(,)로 구분하여 입력하고 레이스를 개시하세요!</div>
        <textarea id="nameInput">한이, 바가, 라면, 진상, 진지, 조교, 제갈태윤, 꼼수</textarea>
        <button class="action-btn" onclick="goToGame()">시작 🏁</button>
        
        <!-- [신기능] 시작 버튼 하단 글씨 링크 (주황색 테마 일치) -->
        <div class="text-links-container">
            <a href="https://lazygyu.github.io/roulette/" target="_blank" class="text-link">마블룰렛</a>
            <a href="https://wheelofnames.com/kqt-zp7" target="_blank" class="text-link">돌림판</a>
        </div>
    </div>

    <!-- [2단계] 게임 화면 -->
    <div id="gameScreen">
        <div class="live-header">
            <div class="live-badge">● LIVE TRACKING</div>
        </div>
        
        <div class="mini-map-container">
            <div class="mini-map-progress" id="miniMapContainer"></div>
            <div class="mini-endpoint"></div>
        </div>

        <div class="stadium-box">
            <canvas id="raceCanvas" width="1000" height="520"></canvas>
        </div>
        <div id="winnerPopup">🥇 WINNER: Kaiser !!</div>
    </div>

    <!-- [3단계] 결과 화면 -->
    <div id="resultScreen">
        <canvas id="confettiCanvas"></canvas>
        <h2>KST RACE Result</h2>
        
        <div class="podium-container">
            <div class="podium-column" id="podium2">
                <div class="podium-user" id="p2Name">🥈 대기</div>
                <div class="podium-medal">🥈</div>
                <div class="podium-box-graphic p-2">2</div>
            </div>
            <div class="podium-column" id="podium1">
                <div class="podium-user" id="p1Name" style="color:#ffd700; font-size:19px;">🥇 대기</div>
                <div class="podium-medal">👑</div>
                <div class="podium-box-graphic p-1">1</div>
            </div>
            <div class="podium-column" id="podium3">
                <div class="podium-user" id="p3Name">🥉 대기</div>
                <div class="podium-medal">🥉</div>
                <div class="podium-box-graphic p-3">3</div>
            </div>
        </div>

        <div class="leaderboard" id="rankList"></div>
        <button class="retry-btn" onclick="goToReady()">다시하기</button>
    </div>

    <script>
        const canvas = document.getElementById('raceCanvas');
        const ctx = canvas.getContext('2d');
        const confettiCanvas = document.getElementById('confettiCanvas');
        const cCtx = confettiCanvas.getContext('2d');
        const miniMapContainer = document.getElementById('miniMapContainer');

        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playBoosterSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(850, audioCtx.currentTime + 0.4);
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.4);
        }

        function playStunSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(400, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(80, audioCtx.currentTime + 0.35);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.35);
        }

        function playBananaSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(200, audioCtx.currentTime);
            osc.frequency.quadraticRampToValueAtTime(600, audioCtx.currentTime + 0.15);
            osc.frequency.quadraticRampToValueAtTime(150, audioCtx.currentTime + 0.3);
            gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        }

        function playFinishSound() {
            if (!audioCtx) return;
            const notes = [261.63, 329.63, 392.00, 523.25]; 
            const now = audioCtx.currentTime;
            notes.forEach((freq, index) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(freq, now + (index * 0.12));
                gain.gain.setValueAtTime(0.1, now + (index * 0.12));
                gain.gain.linearRampToValueAtTime(0.005, now + (index * 0.12) + 0.25);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now + (index * 0.12));
                osc.stop(now + (index * 0.12) + 0.25);
            });
        }

        const teamColors = [
            { main: '#ff2a6d', sub: '#ff76b4' },
            { main: '#05d9e8', sub: '#1dd1a1' },
            { main: '#ffbc42', sub: '#feca57' },
            { main: '#a124f5', sub: '#8e44ad' },
            { main: '#00bbf9', sub: '#1dd1a1' },
            { main: '#00f5d4', sub: '#2e5bff' }
        ];

        let runners = [];
        let items = [];
        let bananas = []; 
        let rankRecords = [];
        let confettiParticles = [];
        let animationFrameId;
        let confettiFrameId;
        
        let camX = 0;
        const startX = 120;
        const finishX = 4500; 
        let laneHeight = 70;
        let firstPlaceDeclared = false;

        function goToGame() {
            initAudio(); 

            const names = document.getElementById('nameInput').value.split(',').map(n => n.trim()).filter(n => n !== '');
            if (names.length === 0) return alert("주자 이름을 입력해 주세요!");

            document.getElementById('readyScreen').style.display = 'none';
            document.getElementById('gameScreen').style.display = 'flex';
            document.getElementById('winnerPopup').className = ''; 

            document.getElementById('podium1').classList.remove('animate');
            document.getElementById('podium2').classList.remove('animate');
            document.getElementById('podium3').classList.remove('animate');

            rankRecords = [];
            firstPlaceDeclared = false;
            items = [];
            bananas = [];
            camX = 0;

            laneHeight = Math.max(55, Math.min(80, 520 / names.length));
            canvas.height = names.length * laneHeight;

            miniMapContainer.innerHTML = '';

            runners = names.map((name, i) => {
                const dot = document.createElement('div');
                dot.className = 'mini-runner-dot';
                dot.id = `miniDot_${i}`;
                dot.style.backgroundColor = teamColors[i % teamColors.length].main;
                dot.innerText = name.slice(0,2);
                miniMapContainer.appendChild(dot);

                return {
                    id: i,
                    name: name,
                    x: startX,
                    y: (i * laneHeight) + (laneHeight / 2),
                    speed: 0,
                    targetSpeed: Math.random() * 3 + 3,
                    color: teamColors[i % teamColors.length].main,
                    colorSub: teamColors[i % teamColors.length].sub,
                    finished: false,
                    pulse: Math.random() * 10,
                    particles: [],
                    status: 'NORMAL',
                    statusTimer: 0
                };
            });

            const boxColumns = 8; 
            for (let i = 0; i < runners.length; i++) {
                const laneY = (i * laneHeight) + (laneHeight / 2);
                for (let j = 0; j < boxColumns; j++) {
                    items.push({
                        x: 450 + (j * 520) + (Math.random() * 120),
                        y: laneY,
                        active: true,
                        pulse: Math.random() * Math.PI
                    });
                }
            }
            
            animationFrameId = requestAnimationFrame(updateRace);
        }

        function showWinnerPopup(name) {
            playFinishSound(); 
            const popup = document.getElementById('winnerPopup');
            popup.innerText = `🥇 1위 ${name} !!`;
            popup.className = 'show';
            setTimeout(() => { popup.className = ''; }, 3500);
        }

        function triggerPodiumShow() {
            confettiCanvas.width = document.getElementById('resultScreen').clientWidth;
            confettiCanvas.height = document.getElementById('resultScreen').clientHeight;

            document.getElementById('p1Name').innerText = rankRecords[0] || "없음";
            document.getElementById('p2Name').innerText = rankRecords[1] || "없음";
            document.getElementById('p3Name').innerText = rankRecords[2] || "없음";

            setTimeout(() => { document.getElementById('podium3').classList.add('animate'); }, 400);
            setTimeout(() => { document.getElementById('podium2').classList.add('animate'); }, 1100);
            setTimeout(() => { document.getElementById('podium1').classList.add('animate'); initConfetti(); }, 1900);
        }

        function goToResult() {
            document.getElementById('gameScreen').style.display = 'none';
            document.getElementById('resultScreen').style.display = 'flex';
            
            const rankList = document.getElementById('rankList');
            rankList.innerHTML = '';
            
            rankRecords.forEach((name, index) => {
                const item = document.createElement('div');
                let rankClass = 'rank-item';
                let medal = `${index + 1}등`;
                
                if(index === 0) { medal = '🥇 1위'; }
                else if(index === 1) { medal = '🥈 2위'; }
                else if(index === 2) { medal = '🥉 3위'; }
                else if(index === rankRecords.length - 1) { rankClass += ' last'; medal = '💀 꼴찌'; }
                
                item.className = rankClass;
                item.innerHTML = `<span>${medal}</span> <span style="font-weight:bold;">${name}</span>`;
                rankList.appendChild(item);
            });

            triggerPodiumShow();
        }

        function goToReady() {
            cancelAnimationFrame(confettiFrameId);
            confettiParticles = [];
            document.getElementById('resultScreen').style.display = 'none';
            document.getElementById('readyScreen').style.display = 'flex';
        }

        function updateRace() {
            let allFinished = true;
            let leadX = 0;
            let unfinishedCount = 0;
            let lastX = Infinity; 
            let lastRunner = null;

            runners.forEach(r => {
                if(!r.finished && r.x > leadX) leadX = r.x;
            });

            runners.forEach(runner => {
                if (!runner.finished) {
                    allFinished = false;
                    unfinishedCount++;

                    let catchUpBuff = 0;
                    if (leadX - runner.x > 400) {
                        catchUpBuff = (leadX - runner.x) * 0.004; 
                    }

                    if (runner.status === 'BOOSTER') {
                        runner.speed += (17 - runner.speed) * 0.15;
                        runner.statusTimer--;
                        if(runner.statusTimer <= 0) runner.status = 'NORMAL';
                    } else if (runner.status === 'STUN') {
                        runner.speed += (0.1 - runner.speed) * 0.2;
                        runner.statusTimer--;
                        if(runner.statusTimer <= 0) runner.status = 'NORMAL';
                    } else {
                        runner.speed += (runner.targetSpeed + catchUpBuff - runner.speed) * 0.05;
                        let progressBonus = (finishX - runner.x) / finishX * 4.5; 
                        if (Math.random() < 0.05) {
                            runner.targetSpeed = (Math.random() * 7 + 3.2) + progressBonus; 
                        }
                    }

                    runner.x += runner.speed;
                    runner.pulse += (runner.status === 'BOOSTER') ? 0.9 : 0.3;

                    if (Math.random() < 0.4) {
                        runner.particles.push({
                            x: runner.x - 12,
                            y: runner.y + 6 + (Math.random() * 6 - 3),
                            size: runner.status === 'BOOSTER' ? Math.random() * 5 + 3 : Math.random() * 3 + 1,
                            alpha: 0.7,
                            color: runner.status === 'BOOSTER' ? '#ffbc42' : (runner.status === 'STUN' ? '#05d9e8' : '#4e5d78')
                        });
                    }

                    bananas.forEach(b => {
                        if (b.active && Math.abs(runner.x - b.x) < 22 && Math.abs(runner.y - b.y) < 15) {
                            b.active = false;
                            runner.status = 'STUN';
                            runner.statusTimer = 40; 
                            playBananaSound(); 
                        }
                    });

                    items.forEach(box => {
                        if (box.active && Math.abs(runner.x - box.x) < 24 && Math.abs(runner.y - box.y) < 12) {
                            box.active = false;
                            if (Math.random() < 0.55) {
                                runner.status = 'BOOSTER'; 
                                runner.statusTimer = 45; 
                                playBoosterSound(); 

                                if (Math.random() < 0.30) {
                                    bananas.push({
                                        x: runner.x - 30,
                                        y: runner.y,
                                        active: true
                                    });
                                }
                            } else {
                                runner.status = 'STUN'; 
                                runner.statusTimer = 35; 
                                playStunSound(); 
                            }
                        }
                    });

                    if (runner.x >= finishX) {
                        runner.finished = true;
                        runner.x = finishX;
                        rankRecords.push(runner.name);

                        if (!firstPlaceDeclared) {
                            firstPlaceDeclared = true;
                            showWinnerPopup(runner.name);
                        }
                    }
                }

                if (!runner.finished) {
                    if (runner.x < lastX) { lastX = runner.x; lastRunner = runner; }
                }

                const dot = document.getElementById(`miniDot_${runner.id}`);
                if (dot) {
                    const pct = Math.min(94, (runner.x / finishX) * 94); 
                    dot.style.left = `${pct}%`;
                }
            });

            let focusX = leadX;
            if (unfinishedCount === 1 && lastRunner) {
                focusX = lastRunner.x;
            }

            if (focusX > 400) {
                let targetCamX = Math.min(focusX - 400, finishX - canvas.width + 120);
                camX += (targetCamX - camX) * 0.08; 
            }

            drawClassicStadium();

            if (!allFinished) {
                animationFrameId = requestAnimationFrame(updateRace);
            } else {
                cancelAnimationFrame(animationFrameId);
                setTimeout(goToResult, 1500); 
            }
        }

        function drawClassicStadium() {
            ctx.fillStyle = '#1a2436';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            runners.forEach((_, i) => {
                ctx.fillStyle = (i % 2 === 0) ? '#a24836' : '#b3533f'; 
                ctx.fillRect(0, i * laneHeight, canvas.width, laneHeight);
                if (i > 0) {
                    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3;
                    ctx.beginPath(); ctx.moveTo(0, i * laneHeight); ctx.lineTo(canvas.width, i * laneHeight); ctx.stroke();
                }
            });

            ctx.save(); ctx.translate(-camX, 0); 

            runners.forEach((_, i) => {
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)'; ctx.lineWidth = 1.5;
                ctx.setLineDash([15, 15]);
                ctx.beginPath(); ctx.moveTo(0, i * laneHeight + laneHeight/2); ctx.lineTo(finishX + 200, i * laneHeight + laneHeight/2); ctx.stroke();
                ctx.setLineDash([]);
            });

            ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 6;
            ctx.beginPath(); ctx.moveTo(startX, 0); ctx.lineTo(startX, canvas.height); ctx.stroke();
            ctx.fillStyle = '#333'; ctx.fillRect(startX - 25, 0, 20, canvas.height);

            const cw = 15; 
            for (let y = 0; y < canvas.height; y += cw) {
                for (let x = 0; x < 2; x++) {
                    ctx.fillStyle = ((Math.floor(y / cw) + x) % 2 === 0) ? '#ffffff' : '#000000';
                    ctx.fillRect(finishX + (x * cw), y, cw, cw);
                }
            }

            bananas.forEach(b => {
                if (b.active) {
                    ctx.save();
                    ctx.translate(b.x, b.y);
                    ctx.shadowColor = '#ffff33'; ctx.shadowBlur = 8;
                    ctx.fillStyle = '#ffea00';
                    ctx.beginPath();
                    ctx.arc(0, 0, 8, 0, Math.PI, false);
                    ctx.closePath();
                    ctx.fill();
                    ctx.strokeStyle = '#d4af37'; ctx.lineWidth = 2;
                    ctx.stroke();
                    ctx.restore();
                    ctx.shadowBlur = 0;
                }
            });

            items.forEach(box => {
                if (box.active) {
                    box.pulse += 0.06;
                    const sizeBounce = 18 + Math.sin(box.pulse) * 3;
                    ctx.save(); ctx.translate(box.x, box.y); ctx.rotate(box.pulse * 0.4);
                    ctx.shadowColor = '#ffd166'; ctx.shadowBlur = 12;
                    ctx.fillStyle = 'rgba(255, 209, 102, 0.3)'; ctx.strokeStyle = '#ffd166'; ctx.lineWidth = 2.5;
                    ctx.fillRect(-sizeBounce/2, -sizeBounce/2, sizeBounce, sizeBounce);
                    ctx.strokeRect(-sizeBounce/2, -sizeBounce/2, sizeBounce, sizeBounce);
                    ctx.fillStyle = '#fff'; ctx.font = 'bold 13px "Paperozi", sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.fillText('?', 0, 0); ctx.restore(); ctx.shadowBlur = 0;
                }
            });

            runners.forEach(runner => {
                runner.particles.forEach((p, idx) => {
                    ctx.fillStyle = p.color; ctx.globalAlpha = p.alpha;
                    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
                    p.alpha -= 0.025;
                    if (p.alpha <= 0) runner.particles.splice(idx, 1);
                });
                ctx.globalAlpha = 1.0;

                const bobbing = Math.sin(runner.pulse) * 3.5;
                ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
                ctx.beginPath(); ctx.arc(runner.x, runner.y + 12, 11, 0, Math.PI * 2); ctx.fill();

                if (runner.status === 'BOOSTER') {
                    ctx.shadowColor = '#ffd166'; ctx.shadowBlur = 20; ctx.strokeStyle = '#ffd166'; ctx.lineWidth = 4;
                    ctx.beginPath(); ctx.arc(runner.x, runner.y + bobbing, 20, 0, Math.PI * 2); ctx.stroke();
                } else if (runner.status === 'STUN') {
                    ctx.shadowColor = '#05d9e8'; ctx.shadowBlur = 15; ctx.strokeStyle = '#05d9e8'; ctx.lineWidth = 3;
                    ctx.setLineDash([4, 4]);
                    ctx.beginPath(); ctx.arc(runner.x, runner.y + bobbing, 18, 0, Math.PI * 2); ctx.stroke();
                    ctx.setLineDash([]);
                }

                let grad = ctx.createRadialGradient(runner.x - 3, runner.y + bobbing - 3, 2, runner.x, runner.y + bobbing, 15);
                grad.addColorStop(0, runner.colorSub); grad.addColorStop(1, runner.color);
                ctx.fillStyle = grad;
                ctx.beginPath(); ctx.arc(runner.x, runner.y + bobbing, 15, 0, Math.PI * 2); ctx.fill();
                ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2.5; ctx.stroke();
                ctx.shadowBlur = 0;

                ctx.fillStyle = '#ffffff'; ctx.font = '800 14px "Paperozi", sans-serif'; ctx.textAlign = 'center';
                ctx.shadowColor = '#000000'; ctx.shadowBlur = 6;
                ctx.fillText(runner.name, runner.x, runner.y + bobbing - 22);
                ctx.shadowBlur = 0;
            });

            ctx.restore(); 
        }

        function initConfetti() {
            confettiParticles = [];
            const colors = ['#ffd700', '#ff007f', '#00f5d4', '#00bbf9', '#ffffff'];
            for (let i = 0; i < 80; i++) {
                confettiParticles.push({
                    x: Math.random() * confettiCanvas.width,
                    y: Math.random() * confettiCanvas.height - confettiCanvas.height,
                    size: Math.random() * 6 + 4,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    speedY: Math.random() * 3 + 2,
                    speedX: Math.random() * 2 - 1,
                    rotation: Math.random() * 360,
                    rotationSpeed: Math.random() * 4 - 2
                });
            }
            updateConfetti();
        }

        function updateConfetti() {
            cCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
            confettiParticles.forEach(p => {
                p.y += p.speedY; p.x += p.speedX; p.rotation += p.rotationSpeed;
                cCtx.save(); cCtx.translate(p.x, p.y); cCtx.rotate(p.rotation * Math.PI / 180);
                cCtx.fillStyle = p.color; cCtx.fillRect(-p.size/2, -p.size/2, p.size, p.size); cCtx.restore();
                if (p.y > confettiCanvas.height) {
                    p.y = -10; p.x = Math.random() * confettiCanvas.width;
                }
            });
            confettiFrameId = requestAnimationFrame(updateConfetti);
        }
    </script>
